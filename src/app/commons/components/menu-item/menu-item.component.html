<ng-container *ngIf="item.children?.length; else leafNode">
  <button mat-menu-item [matMenuTriggerFor]="childMenu" [disabled]="item.disabled">
    {{ item.label }}
  </button>
  <mat-menu #childMenu="matMenu">
    <app-menu-item *ngFor="let child of item.children" [item]="child"></app-menu-item>
  </mat-menu>
</ng-container>

<ng-template #leafNode>
  <button mat-menu-item [disabled]="item.disabled">
    {{ item.label }}
  </button>
</ng-template>
