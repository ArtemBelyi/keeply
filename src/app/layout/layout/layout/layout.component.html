<div class="app-container">
  <app-header></app-header>

  <as-split class="app-content" direction="vertical" unit="percent" [gutterSize]="6">
    <as-split-area [minSize]="20">
      <as-split direction="horizontal" [gutterSize]="6">
        <as-split-area [minSize]="15">
          <app-sidebar></app-sidebar>
        </as-split-area>
        <as-split-area>
          <app-content></app-content>
        </as-split-area>
      </as-split>
    </as-split-area>

    <as-split-area [size]="10" [minSize]="5" [maxSize]="20">
      <app-footer></app-footer>
    </as-split-area>
  </as-split>
</div>
