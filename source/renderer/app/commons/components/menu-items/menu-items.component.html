<ng-template #menu>
  <div cdkMenu>
    <ng-container *ngFor="let item of menuItems">
      <ng-container *ngIf="item.children?.length; else leafNode">
        <app-menu-items #menuComponent [menuItems]="item.children!"></app-menu-items>

        <button
          cdkMenuItem
          [cdkMenuTriggerFor]="menuComponent.menu"
          [disabled]="item.disabled"
        >
          <div>{{ item.label }}</div>
          <div class="menu-arrow">▸</div>
        </button>
      </ng-container>

      <ng-template #leafNode>
        <button cdkMenuItem [disabled]="item.disabled">
          {{ item.label }}
        </button>
      </ng-template>
    </ng-container>
  </div>
</ng-template>
